services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subguard-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subguard-dashboard
    command:
      - python
      - -m
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped